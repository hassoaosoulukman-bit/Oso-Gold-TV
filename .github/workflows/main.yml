name: Build Oso Gold TV APK

on:
  workflow_dispatch:
  push:
    branches: [ v2, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          if [ -d "OsoGoldTV" ]; then cd OsoGoldTV; fi
          chmod +x gradlew || true
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oso-Gold-TV-APK
          path: "**/build/outputs/apk/debug/*.apk"
