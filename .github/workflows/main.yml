name: Build Oso Gold TV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip OsoGoldTV_Pro
        run: |
          mkdir -p extracted
          unzip -o OsoGoldTV/OsoGoldTV_Pro.zip -d extracted/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=$(find extracted -name "build.gradle.kts" -exec dirname {} \; | head -n 1); fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oso-Gold-TV-New-APK
          path: "**/build/outputs/apk/debug/*.apk"
