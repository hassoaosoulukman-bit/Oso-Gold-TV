name: Build Oso Gold TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inspect and Fix
        run: |
          mkdir -p extracted
          unzip -o OsoGoldTV/OsoGoldTV_Pro.zip -d extracted/
          echo "=== PlaylistRepository.kt ==="
          sed -n '115,130p' extracted/OsoGoldTV/app/src/main/java/com/osogold/tv/PlaylistRepository.kt
          echo "=== RecordingStore.kt ==="
          sed -n '125,140p' extracted/OsoGoldTV/app/src/main/java/com/osogold/tv/RecordingStore.kt
          echo "=== VlcEngine.kt ==="
          sed -n '88,105p' extracted/OsoGoldTV/app/src/main/java/com/osogold/tv/VlcEngine.kt
